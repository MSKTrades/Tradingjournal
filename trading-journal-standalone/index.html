<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PipEcho — Trading Journal, Backtesting & Session Analytics for Traders</title>
    <meta name="description" content="PipEcho is a trading journal, backtesting and session-analytics workspace built for every trader — forex, crypto, futures, and stocks — with Strategy Playbooks, Risk Guardrail, and pre-trade checklists included free." />

    <!--
      Site-wide fallback Open Graph/Twitter Card tags. These are static (baked
      into this one index.html, which every route serves since this is a
      client-rendered SPA with no per-route server rendering) rather than
      per-page — a deliberate phase-1 tradeoff. Social/chat-app link
      unfurlers (Twitter, Discord, Slack, Facebook) generally do NOT execute
      JavaScript, so a per-route title/description set client-side (see
      src/lib/useDocumentMeta.ts) never reaches them; only what's already in
      this raw HTML does. A shared, on-brand image + description here is a
      big upgrade from the previous no-preview-at-all state for every shared
      link, even though a link to a specific blog post won't yet show that
      post's own title/excerpt in the preview card. Per-page social previews
      would need actual per-route HTML (e.g. a small Vercel Edge Middleware
      injecting route-specific tags, or prerendering) — a reasonable phase 2,
      intentionally not done here to avoid shipping unverified middleware.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PipEcho" />
    <meta property="og:title" content="PipEcho — Trading Journal, Backtesting & Session Analytics for Traders" />
    <meta property="og:description" content="A trading journal, backtesting and session-analytics workspace built for every trader — forex, crypto, futures, and stocks — with Strategy Playbooks, Risk Guardrail, and pre-trade checklists included free." />
    <meta property="og:image" content="https://pipecho.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://pipecho.com/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PipEcho — Trading Journal, Backtesting & Session Analytics for Traders" />
    <meta name="twitter:description" content="A trading journal, backtesting and session-analytics workspace built for every trader — forex, crypto, futures, and stocks — with Strategy Playbooks, Risk Guardrail, and pre-trade checklists included free." />
    <meta name="twitter:image" content="https://pipecho.com/og-image.png" />

    <link rel="canonical" href="https://pipecho.com/" />
    <meta name="theme-color" content="#0d0f14" />
